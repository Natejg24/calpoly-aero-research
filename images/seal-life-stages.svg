<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="seal-title seal-desc">
  <title id="seal-title">Meet the Pod</title>
  <desc id="seal-desc">Four original illustrations of a seal progressing from a playful pup, to training with a backpack and a balanced ball, to certification in a cap with a diploma, to a calm veteran researcher welcomed into the pod.</desc>

  <!-- panel dividers -->
  <line x1="250" y1="24" x2="250" y2="256" stroke="var(--color-border, #D8E2F0)" stroke-width="1"/>
  <line x1="500" y1="24" x2="500" y2="256" stroke="var(--color-border, #D8E2F0)" stroke-width="1"/>
  <line x1="750" y1="24" x2="750" y2="256" stroke="var(--color-border, #D8E2F0)" stroke-width="1"/>

  <!-- ground shadows -->
  <ellipse cx="125" cy="222" rx="46" ry="8" fill="var(--color-border, #D8E2F0)" opacity="0.6"/>
  <ellipse cx="375" cy="228" rx="56" ry="9" fill="var(--color-border, #D8E2F0)" opacity="0.6"/>
  <ellipse cx="625" cy="232" rx="64" ry="10" fill="var(--color-border, #D8E2F0)" opacity="0.6"/>
  <ellipse cx="875" cy="236" rx="72" ry="11" fill="var(--color-border, #D8E2F0)" opacity="0.6"/>

  <!-- ===================== Panel 1: Pup ===================== -->
  <g transform="translate(125,145) scale(3.2) translate(-12,-12.5)">
    <ellipse cx="12" cy="12.5" rx="7.5" ry="8.2" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="5.2" cy="16.5" rx="2.5" ry="1.3" transform="rotate(-28 5.2 16.5)" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="18.8" cy="16.5" rx="2.5" ry="1.3" transform="rotate(28 18.8 16.5)" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="12" cy="14.2" rx="3.2" ry="2.2" fill="#fff" opacity="0.25"/>
    <circle cx="9.3" cy="10.3" r="1.15" fill="#fff"/>
    <circle cx="14.7" cy="10.3" r="1.15" fill="#fff"/>
    <circle cx="9.5" cy="10.3" r="0.5" fill="var(--color-primary-900, #153A76)"/>
    <circle cx="14.5" cy="10.3" r="0.5" fill="var(--color-primary-900, #153A76)"/>
    <circle cx="12" cy="13.5" r="0.9" fill="var(--color-accent-700, #9F304A)"/>
    <path d="M12 14.3 C11.4 15.1 10.6 15.2 10 14.9 M12 14.3 C12.6 15.1 13.4 15.2 14 14.9"
          fill="none" stroke="#fff" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M9.5 13.8 L5.8 12.8 M9.4 14.5 L5.5 14.6 M14.5 13.8 L18.2 12.8 M14.6 14.5 L18.5 14.6"
          fill="none" stroke="#fff" stroke-width="0.5" stroke-linecap="round" opacity="0.85"/>
  </g>
  <text x="125" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#FF9CAF">Pup</text>

  <!-- ===================== Panel 2: In Training ===================== -->
  <g transform="translate(375,142) scale(3.8) translate(-12,-12.5)">
    <!-- backpack strap -->
    <path d="M6 8 Q12 6 18 8 L18 16 Q12 18.5 6 16 Z" fill="var(--color-accent-700, #9F304A)" opacity="0.85"/>
    <ellipse cx="12" cy="12.5" rx="7.5" ry="8.2" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="5.2" cy="16.5" rx="2.5" ry="1.3" transform="rotate(-28 5.2 16.5)" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="18.8" cy="16.5" rx="2.5" ry="1.3" transform="rotate(28 18.8 16.5)" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="12" cy="14.2" rx="3.2" ry="2.2" fill="#fff" opacity="0.25"/>
    <circle cx="9.3" cy="10.3" r="1.05" fill="#fff"/>
    <circle cx="14.7" cy="10.3" r="1.05" fill="#fff"/>
    <circle cx="9.5" cy="10.3" r="0.45" fill="var(--color-primary-900, #153A76)"/>
    <circle cx="14.5" cy="10.3" r="0.45" fill="var(--color-primary-900, #153A76)"/>
    <circle cx="12" cy="13.5" r="0.85" fill="var(--color-accent-700, #9F304A)"/>
    <path d="M12 14.3 C11.4 15.1 10.6 15.2 10 14.9 M12 14.3 C12.6 15.1 13.4 15.2 14 14.9"
          fill="none" stroke="#fff" stroke-width="0.65" stroke-linecap="round"/>
    <path d="M9.5 13.8 L5.8 12.8 M9.4 14.5 L5.5 14.6 M14.5 13.8 L18.2 12.8 M14.6 14.5 L18.5 14.6"
          fill="none" stroke="#fff" stroke-width="0.45" stroke-linecap="round" opacity="0.85"/>
    <!-- balanced ball on nose -->
    <circle cx="12" cy="3.3" r="1.6" fill="var(--color-accent-700, #9F304A)"/>
    <path d="M12 1.9 L12 4.7 M10.7 3.3 L13.3 3.3" stroke="#fff" stroke-width="0.25"/>
  </g>
  <text x="375" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#FF9CAF">In Training</text>

  <!-- ===================== Panel 3: Certified ===================== -->
  <g transform="translate(625,150) scale(4.4) translate(-12,-12.5)">
    <ellipse cx="12" cy="12.5" rx="7.5" ry="8.2" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="5.2" cy="16.5" rx="2.5" ry="1.3" transform="rotate(-28 5.2 16.5)" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="18.8" cy="16.5" rx="2.5" ry="1.3" transform="rotate(28 18.8 16.5)" fill="var(--color-primary-900, #153A76)"/>
    <!-- diploma held at flipper -->
    <rect x="16.5" y="15.5" width="4.4" height="2.2" rx="0.4" fill="#fff" transform="rotate(24 18.7 16.6)"/>
    <rect x="16.5" y="16.3" width="4.4" height="0.6" fill="var(--color-accent-700, #9F304A)" transform="rotate(24 18.7 16.6)"/>
    <ellipse cx="12" cy="14.2" rx="3.2" ry="2.2" fill="#fff" opacity="0.25"/>
    <circle cx="9.3" cy="10.3" r="0.95" fill="#fff"/>
    <circle cx="14.7" cy="10.3" r="0.95" fill="#fff"/>
    <circle cx="9.5" cy="10.3" r="0.4" fill="var(--color-primary-900, #153A76)"/>
    <circle cx="14.5" cy="10.3" r="0.4" fill="var(--color-primary-900, #153A76)"/>
    <circle cx="12" cy="13.5" r="0.8" fill="var(--color-accent-700, #9F304A)"/>
    <path d="M12 14.3 C11.4 15.1 10.6 15.2 10 14.9 M12 14.3 C12.6 15.1 13.4 15.2 14 14.9"
          fill="none" stroke="#fff" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M9.5 13.8 L5.8 12.8 M9.4 14.5 L5.5 14.6 M14.5 13.8 L18.2 12.8 M14.6 14.5 L18.5 14.6"
          fill="none" stroke="#fff" stroke-width="0.4" stroke-linecap="round" opacity="0.85"/>
    <!-- graduation cap -->
    <path d="M6.5 4.6 L12 2.2 L17.5 4.6 L12 7 Z" fill="var(--color-accent-700, #9F304A)"/>
    <rect x="11.4" y="6.6" width="1.2" height="1.6" fill="var(--color-accent-700, #9F304A)"/>
    <circle cx="12" cy="8.3" r="0.55" fill="var(--color-accent-700, #9F304A)"/>
    <path d="M17.5 4.6 L17.9 7.4" stroke="var(--color-accent-700, #9F304A)" stroke-width="0.3" fill="none"/>
  </g>
  <text x="625" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#FF9CAF">Certified</text>

  <!-- ===================== Panel 4: Veteran Researcher ===================== -->
  <g transform="translate(875,155) scale(5.0) translate(-12,-12.5)">
    <ellipse cx="12" cy="12.5" rx="7.5" ry="8.2" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="5.2" cy="16.5" rx="2.5" ry="1.3" transform="rotate(-28 5.2 16.5)" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="18.8" cy="16.5" rx="2.5" ry="1.3" transform="rotate(28 18.8 16.5)" fill="var(--color-primary-900, #153A76)"/>
    <ellipse cx="12" cy="14.2" rx="3.2" ry="2.2" fill="#fff" opacity="0.25"/>
    <circle cx="9.3" cy="10.4" r="0.85" fill="#fff"/>
    <circle cx="14.7" cy="10.4" r="0.85" fill="#fff"/>
    <circle cx="9.45" cy="10.4" r="0.35" fill="var(--color-primary-900, #153A76)"/>
    <circle cx="14.55" cy="10.4" r="0.35" fill="var(--color-primary-900, #153A76)"/>
    <circle cx="12" cy="13.5" r="0.75" fill="var(--color-accent-700, #9F304A)"/>
    <path d="M12 14.3 C11.5 14.9 10.8 15 10.3 14.8 M12 14.3 C12.5 14.9 13.2 15 13.7 14.8"
          fill="none" stroke="#fff" stroke-width="0.55" stroke-linecap="round"/>
    <path d="M9.6 13.9 L6.2 13.1 M9.5 14.5 L6 14.6 M14.4 13.9 L17.8 13.1 M14.5 14.5 L18 14.6"
          fill="none" stroke="#fff" stroke-width="0.35" stroke-linecap="round" opacity="0.85"/>
    <!-- credential badge -->
    <circle cx="12" cy="12.5" r="1.5" fill="var(--color-accent-700, #9F304A)" opacity="0.9"/>
    <path d="M11.1 12.5 L11.7 13.1 L12.9 11.8" fill="none" stroke="#fff" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="875" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#FF9CAF">Veteran Researcher</text>
</svg>
