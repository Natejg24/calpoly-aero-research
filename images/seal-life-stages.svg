<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="otter-title otter-desc">
  <title id="otter-title">Meet the Pod</title>
  <desc id="otter-desc">Four original illustrated panels showing an otter progressing from a playful pup, to training with a backpack and a balanced ball, to certification in a cap with a diploma, to a calm veteran researcher welcomed into the pod.</desc>

  <defs>
    <style>
      .otter-ground { fill: var(--color-border, #E1DFC0); }
      .otter-fur { fill: var(--color-primary-900, #0B4A46); }
      .otter-fur-light { fill: var(--color-primary-700, #0E6D66); }
      .otter-face { fill: var(--color-bg, #F5F5DC); }
      .otter-accent { fill: var(--color-accent-600, #FF7F50); }
      .otter-brand { fill: var(--color-brand-500, #40E0D0); }
      .otter-ink { fill: var(--color-ink-900, #1B2A4A); }
      .otter-whisker { stroke: var(--color-ink-500, #566080); stroke-width: 1; fill: none; opacity: 0.5; }
      .otter-panel-label {
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: var(--color-ink-500, #566080);
      }
    </style>
  </defs>

  <!-- panel dividers -->
  <line x1="250" y1="20" x2="250" y2="280" stroke="var(--color-border, #E1DFC0)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="500" y1="20" x2="500" y2="280" stroke="var(--color-border, #E1DFC0)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="750" y1="20" x2="750" y2="280" stroke="var(--color-border, #E1DFC0)" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- ================= PANEL 1: Pup ================= -->
  <g transform="translate(0,0)">
    <rect x="20" y="222" width="210" height="10" rx="5" class="otter-ground"/>
    <!-- water splash marks -->
    <circle cx="48" cy="70" r="3" class="otter-brand" opacity="0.5"/>
    <path d="M35 95 q10 -12 22 -6" stroke="var(--color-brand-500,#40E0D0)" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M58 60 q8 10 2 20" stroke="var(--color-brand-500,#40E0D0)" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>
    <!-- pup: lean body, tail, round ears, big eyes -->
    <g transform="translate(88,128)">
      <ellipse cx="30" cy="80" rx="24" ry="26" class="otter-fur"/>
      <path d="M48 96 q16 4 20 22 q-12 -2 -20 -18 Z" class="otter-fur-light"/>
      <circle cx="30" cy="34" r="26" class="otter-fur"/>
      <circle cx="13.9" cy="17.9" r="8.3" class="otter-fur"/>
      <circle cx="46.1" cy="17.9" r="8.3" class="otter-fur"/>
      <circle cx="13.9" cy="17.9" r="4.2" class="otter-fur-light"/>
      <circle cx="46.1" cy="17.9" r="4.2" class="otter-fur-light"/>
      <ellipse cx="30" cy="42" rx="14" ry="10" class="otter-face"/>
      <circle cx="23" cy="30" r="3" class="otter-ink"/>
      <circle cx="37" cy="30" r="3" class="otter-ink"/>
      <circle cx="30" cy="42" r="2" class="otter-accent"/>
      <path d="M18 43 q-9 -1 -15 2" class="otter-whisker"/>
      <path d="M42 43 q9 -1 15 2" class="otter-whisker"/>
      <!-- paws, playful, raised -->
      <ellipse cx="0" cy="76" rx="10" ry="16" class="otter-fur-light" transform="rotate(-35 0 76)"/>
      <ellipse cx="60" cy="76" rx="10" ry="16" class="otter-fur-light" transform="rotate(35 60 76)"/>
      <path d="M14 100 q16 12 32 0 q-16 6 -32 0 Z" class="otter-fur"/>
    </g>
    <text x="125" y="260" text-anchor="middle" class="otter-panel-label">Pup</text>
  </g>

  <!-- ================= PANEL 2: Trains ================= -->
  <g transform="translate(250,0)">
    <rect x="20" y="222" width="210" height="10" rx="5" class="otter-ground"/>
    <g transform="translate(90,110)">
      <!-- backpack -->
      <rect x="-22" y="34" width="24" height="42" rx="8" class="otter-brand"/>
      <!-- lean body -->
      <ellipse cx="30" cy="90" rx="27" ry="26" class="otter-fur"/>
      <!-- head + round ears -->
      <circle cx="28" cy="30" r="23" class="otter-fur"/>
      <circle cx="13.7" cy="15.7" r="7.4" class="otter-fur"/>
      <circle cx="42.3" cy="15.7" r="7.4" class="otter-fur"/>
      <circle cx="13.7" cy="15.7" r="3.7" class="otter-fur-light"/>
      <circle cx="42.3" cy="15.7" r="3.7" class="otter-fur-light"/>
      <ellipse cx="28" cy="37" rx="13" ry="9" class="otter-face"/>
      <circle cx="22" cy="27" r="2.4" class="otter-ink"/>
      <circle cx="34" cy="27" r="2.4" class="otter-ink"/>
      <circle cx="28" cy="37" r="1.8" class="otter-accent"/>
      <path d="M17 38 q-9 -1 -15 2" class="otter-whisker"/>
      <path d="M39 38 q9 -1 15 2" class="otter-whisker"/>
      <!-- balanced ball on nose -->
      <circle cx="28" cy="4" r="7" class="otter-accent"/>
      <!-- paw holding wrench -->
      <path d="M58 66 q18 -6 22 -24" stroke="var(--color-primary-900,#0B4A46)" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g transform="translate(78,36) rotate(35)">
        <rect x="-4" y="0" width="8" height="24" rx="3" class="otter-brand"/>
        <circle cx="0" cy="-4" r="6.5" fill="none" stroke="var(--color-brand-500,#40E0D0)" stroke-width="4"/>
      </g>
      <ellipse cx="0" cy="98" rx="10" ry="15" class="otter-fur-light" transform="rotate(-20 0 98)"/>
      <path d="M60 88 q20 6 12 30" stroke="var(--color-primary-900,#0B4A46)" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>
    <text x="125" y="260" text-anchor="middle" class="otter-panel-label">Trains</text>
  </g>

  <!-- ================= PANEL 3: Certified ================= -->
  <g transform="translate(500,0)">
    <rect x="20" y="222" width="210" height="10" rx="5" class="otter-ground"/>
    <!-- confetti -->
    <circle cx="55" cy="50" r="3" class="otter-accent"/>
    <circle cx="190" cy="70" r="3" class="otter-brand"/>
    <rect x="70" y="35" width="5" height="5" class="otter-brand" transform="rotate(20 70 35)"/>
    <rect x="175" y="45" width="5" height="5" class="otter-accent" transform="rotate(-15 175 45)"/>
    <g transform="translate(90,108)">
      <ellipse cx="30" cy="86" rx="29" ry="28" class="otter-fur"/>
      <!-- graduation sash -->
      <path d="M4 70 Q30 88 56 70 L56 92 Q30 108 4 92 Z" class="otter-brand"/>
      <circle cx="28" cy="30" r="23" class="otter-fur"/>
      <circle cx="13.7" cy="15.7" r="7.4" class="otter-fur"/>
      <circle cx="42.3" cy="15.7" r="7.4" class="otter-fur"/>
      <circle cx="13.7" cy="15.7" r="3.7" class="otter-fur-light"/>
      <circle cx="42.3" cy="15.7" r="3.7" class="otter-fur-light"/>
      <ellipse cx="28" cy="37" rx="13" ry="9" class="otter-face"/>
      <circle cx="22" cy="27" r="2.4" class="otter-ink"/>
      <circle cx="34" cy="27" r="2.4" class="otter-ink"/>
      <circle cx="28" cy="37" r="1.8" class="otter-accent"/>
      <path d="M17 38 q-9 -1 -15 2" class="otter-whisker"/>
      <path d="M39 38 q9 -1 15 2" class="otter-whisker"/>
      <!-- cap -->
      <rect x="4" y="-4" width="48" height="8" rx="2" class="otter-ink"/>
      <path d="M28 -16 L54 0 L28 8 L2 0 Z" class="otter-ink"/>
      <path d="M54 0 L58 20" stroke="var(--color-ink-900,#1B2A4A)" stroke-width="2" fill="none"/>
      <circle cx="58" cy="22" r="3" class="otter-accent"/>
      <!-- diploma balanced on nose -->
      <rect x="16" y="4" width="24" height="6" rx="2" class="otter-accent" transform="rotate(-4 28 7)"/>
      <ellipse cx="0" cy="94" rx="10" ry="15" class="otter-fur-light" transform="rotate(-20 0 94)"/>
      <ellipse cx="60" cy="94" rx="10" ry="15" class="otter-fur-light" transform="rotate(20 60 94)"/>
    </g>
    <text x="125" y="260" text-anchor="middle" class="otter-panel-label">Certified</text>
  </g>

  <!-- ================= PANEL 4: Joins the Pod ================= -->
  <g transform="translate(750,0)">
    <rect x="20" y="222" width="210" height="10" rx="5" class="otter-ground"/>
    <!-- orbit ring, aerospace nod -->
    <ellipse cx="125" cy="120" rx="86" ry="30" fill="none" stroke="var(--color-brand-500,#40E0D0)" stroke-width="1.5" opacity="0.45"/>
    <circle cx="200" cy="106" r="3.5" class="otter-brand"/>
    <!-- two small pod-mates in the background -->
    <g transform="translate(24,168)" opacity="0.55">
      <ellipse cx="14" cy="30" rx="16" ry="11" class="otter-fur-light"/>
      <circle cx="14" cy="12" r="11" class="otter-fur-light"/>
      <circle cx="7.2" cy="5.2" r="3.5" class="otter-fur-light"/>
      <circle cx="20.8" cy="5.2" r="3.5" class="otter-fur-light"/>
    </g>
    <g transform="translate(178,172)" opacity="0.55">
      <ellipse cx="14" cy="26" rx="14" ry="10" class="otter-fur-light"/>
      <circle cx="14" cy="10" r="10" class="otter-fur-light"/>
      <circle cx="7.8" cy="3.8" r="3.2" class="otter-fur-light"/>
      <circle cx="20.2" cy="3.8" r="3.2" class="otter-fur-light"/>
    </g>
    <!-- calm veteran otter, centered -->
    <g transform="translate(90,112)">
      <ellipse cx="30" cy="88" rx="27" ry="26" class="otter-fur"/>
      <path d="M46 100 q16 4 18 22 q-11 -3 -18 -18 Z" class="otter-fur-light"/>
      <circle cx="28" cy="30" r="23" class="otter-fur"/>
      <circle cx="13.7" cy="15.7" r="7.4" class="otter-fur"/>
      <circle cx="42.3" cy="15.7" r="7.4" class="otter-fur"/>
      <circle cx="13.7" cy="15.7" r="3.7" class="otter-fur-light"/>
      <circle cx="42.3" cy="15.7" r="3.7" class="otter-fur-light"/>
      <ellipse cx="28" cy="37" rx="13" ry="9" class="otter-face"/>
      <!-- eyes closed, serene -->
      <path d="M19 27 q4 3 8 0" stroke="var(--color-ink-900,#1B2A4A)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M29 27 q4 3 8 0" stroke="var(--color-ink-900,#1B2A4A)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="28" cy="37" r="1.8" class="otter-accent"/>
      <path d="M17 38 q-9 -1 -15 2" class="otter-whisker"/>
      <path d="M39 38 q9 -1 15 2" class="otter-whisker"/>
      <!-- paws resting -->
      <ellipse cx="0" cy="82" rx="9" ry="14" class="otter-fur-light" transform="rotate(-16 0 82)"/>
      <ellipse cx="60" cy="82" rx="9" ry="14" class="otter-fur-light" transform="rotate(16 60 82)"/>
      <path d="M14 98 q16 10 32 0 q-16 6 -32 0 Z" class="otter-fur"/>
    </g>
    <text x="125" y="260" text-anchor="middle" class="otter-panel-label">Joins the Pod</text>
  </g>
</svg>
