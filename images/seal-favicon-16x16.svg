<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="3 3 18 19"
     width="16"
     height="16"
     role="img"
     aria-label="Seal icon">
  <!-- seal head/body -->
  <ellipse cx="12" cy="12.5" rx="7.5" ry="8.2" fill="#FF9CAF"/>

  <!-- flippers -->
  <ellipse cx="5.2" cy="16.5" rx="2.5" ry="1.3"
           transform="rotate(-28 5.2 16.5)" fill="#FF9CAF"/>
  <ellipse cx="18.8" cy="16.5" rx="2.5" ry="1.3"
           transform="rotate(28 18.8 16.5)" fill="#FF9CAF"/>

  <!-- eyes -->
  <circle cx="9.3" cy="10.5" r="0.9" fill="#153A76"/>
  <circle cx="14.7" cy="10.5" r="0.9" fill="#153A76"/>

  <!-- muzzle -->
  <ellipse cx="12" cy="14.2" rx="3.2" ry="2.2"
           fill="#153A76" opacity="0.18"/>

  <!-- nose -->
  <circle cx="12" cy="13.5" r="0.9" fill="#153A76"/>

  <!-- mouth -->
  <path d="M12 14.3 C11.4 15.1 10.6 15.2 10 14.9
           M12 14.3 C12.6 15.1 13.4 15.2 14 14.9"
        fill="none"
        stroke="#153A76"
        stroke-width="0.7"
        stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M9.5 13.8 L5.8 12.8
           M9.4 14.5 L5.5 14.6
           M14.5 13.8 L18.2 12.8
           M14.6 14.5 L18.5 14.6"
        fill="none"
        stroke="#153A76"
        stroke-width="0.6"
        stroke-linecap="round"/>
</svg>
